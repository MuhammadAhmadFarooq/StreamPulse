app = "streampulse"
primary_region = "sin"  # Singapore — change to your nearest: lax, iad, lhr, fra, syd

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  CLIENT_DIST_PATH = "/app/client/dist"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "streampulse_downloads"
  destination = "/app/server/downloads"
